<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3. A conversation on crutches</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;font-family:Helvetica,Arial,sans-serif}
canvas{display:block}
#cap{position:fixed;left:0;right:0;bottom:0;padding:10px 18px 12px;
 background:linear-gradient(to top,rgba(2,4,8,.94),rgba(2,4,8,0));color:#e8eef8;font-size:14px}
#cap b{color:#ffd173;letter-spacing:1.5px;font-size:11px;display:block;margin-bottom:2px}
#dialogue{position:fixed;left:6%;right:6%;bottom:66px;text-align:center;transition:opacity .25s;opacity:0}
#who{font-size:11px;letter-spacing:2.2px;margin-bottom:5px;font-weight:bold}
#line{font-size:22px;color:#f4f7ff;line-height:1.3;text-shadow:0 2px 12px rgba(0,0,0,.95)}
#title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
 background:rgba(4,6,11,.86);color:#fff;transition:opacity .5s}
#title h1{font-size:23px;margin:0 0 6px;font-weight:600}
#title p{margin:0;color:#a2b0c4;font-size:13px}
</style>
</head>
<body>
<div id="title"><h1>3. A conversation, without legs</h1><p>a man on crutches, and the one who will not listen</p></div>
<div id="dialogue"><div id="who"></div><div id="line"></div></div>
<div id="cap"><b>PRINCIPLE</b><span id="capText"></span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.Fog(0x05070d, 11, 26);

const camera = new THREE.PerspectiveCamera(46, 800/450, 0.1, 90);
camera.position.set(0, 2.1, 8.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(800, 450);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- stage ----------
const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 72),
  new THREE.MeshPhongMaterial({color:0x0e1524, shininess:70}));
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const wallPlane = new THREE.Mesh(new THREE.PlaneGeometry(34, 14),
  new THREE.MeshLambertMaterial({color:0x090e18}));
wallPlane.position.set(0, 6, -7);
scene.add(wallPlane);

scene.add(new THREE.AmbientLight(0x7f97b8, 0.42));

function makeSpot(x, color, intensity) {
  const s = new THREE.SpotLight(color, intensity, 30, 0.52, 0.5, 1);
  s.position.set(x, 8.6, 2.4);
  s.target.position.set(x * 0.92, 1.3, 0);
  s.castShadow = true;
  s.shadow.mapSize.set(512, 512);
  scene.add(s); scene.add(s.target);
  return s;
}
const spotHero = makeSpot(-1.7, 0xffe2b4, 5.4);
const spotOther = makeSpot(1.7, 0xa8caff, 4.0);

const rim = new THREE.PointLight(0xff5470, 0.75, 24);
rim.position.set(0, 3.0, -5.5);
scene.add(rim);

const dustGeo = new THREE.BufferGeometry();
const DUST_N = 240;
const dpos = new Float32Array(DUST_N * 3);
for (let i = 0; i < DUST_N; i++) {
  dpos[i*3]   = (Math.random() - 0.5) * 9;
  dpos[i*3+1] = Math.random() * 4.6;
  dpos[i*3+2] = (Math.random() - 0.5) * 7;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color:0xbcd3ee, size:0.03, transparent:true, opacity:0.45 }));
scene.add(dust);

// ---------- anatomy helpers ----------
const SKIN  = new THREE.MeshPhongMaterial({color:0xd6a178, shininess:16});
const HAIR  = new THREE.MeshPhongMaterial({color:0x17120f, shininess:55});
const EYEW  = new THREE.MeshPhongMaterial({color:0xf7f9ff, shininess:100});
const EYEB  = new THREE.MeshBasicMaterial({color:0x0c0f14});
const MOUTH = new THREE.MeshPhongMaterial({color:0x3d1d22, shininess:30});

// tapered limb between two lengths
function taper(rTop, rBot, len, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, len, 14), mat);
  return m;
}
function ball(r, mat) {
  return new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
}

function buildHead(scale) {
  const g = new THREE.Group();
  const skull = ball(0.135, SKIN);
  skull.scale.set(0.92, 1.08, 0.95);
  skull.castShadow = true;
  g.add(skull);

  // jaw
  const jaw = ball(0.105, SKIN);
  jaw.position.set(0, -0.085, 0.028);
  jaw.scale.set(0.95, 0.75, 0.92);
  g.add(jaw);

  // brow ridge
  const browRidge = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.03, 0.05), SKIN);
  browRidge.position.set(0, 0.055, 0.115);
  g.add(browRidge);

  // nose
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.075, 8), SKIN);
  nose.position.set(0, -0.005, 0.145);
  nose.rotation.x = Math.PI / 2;
  g.add(nose);

  // lips
  const lips = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.022, 0.03), MOUTH);
  lips.position.set(0, -0.072, 0.128);
  g.add(lips);

  // mouth interior, scaled to open
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10),
    new THREE.MeshBasicMaterial({color:0x1a0a0d}));
  mouth.position.set(0, -0.078, 0.118);
  mouth.scale.set(1.0, 0.25, 0.5);
  g.add(mouth);

  // eyes
  const eyes = [];
  [-0.052, 0.052].forEach(x => {
    const w = ball(0.032, EYEW);
    w.position.set(x, 0.005, 0.108);
    g.add(w);
    const p = ball(0.015, EYEB);
    p.position.set(x, 0.005, 0.132);
    g.add(p);
    eyes.push(p);
  });

  // brows
  const brows = [];
  [-0.052, 0.052].forEach((x, i) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.014, 0.018), HAIR);
    b.position.set(x, 0.052, 0.128);
    g.add(b);
    brows.push({ mesh: b, side: i === 0 ? -1 : 1 });
  });

  // ears
  [-1, 1].forEach(s => {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), SKIN);
    ear.position.set(s * 0.125, -0.01, 0.01);
    ear.scale.set(0.5, 1.0, 0.8);
    g.add(ear);
  });

  // hair cap
  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.142, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.62), HAIR);
  hair.position.y = 0.012;
  hair.scale.set(0.95, 1.05, 0.97);
  g.add(hair);

  g.scale.setScalar(scale);
  return { group: g, mouth, brows, eyes };
}

// a full human: legs or crutches, shared upper body
function buildHuman(opts) {
  const cloth = new THREE.MeshPhongMaterial({color: opts.cloth, shininess:26});
  const clothDark = new THREE.MeshPhongMaterial({color: opts.clothDark || 0x1c2432, shininess:22});
  const root = new THREE.Group();

  const hipY = opts.hipY;

  // pelvis
  const pelvis = ball(0.16, clothDark);
  pelvis.position.y = hipY + 0.05;
  pelvis.scale.set(1.15, 0.8, 0.95);
  pelvis.castShadow = true;
  root.add(pelvis);

  // torso, tapered from chest to waist
  const torso = taper(0.185, 0.145, 0.44, cloth);
  torso.position.y = hipY + 0.30;
  torso.castShadow = true;
  root.add(torso);

  // chest volume and shoulder yoke
  const chest = ball(0.185, cloth);
  chest.position.y = hipY + 0.50;
  chest.scale.set(1.12, 1.0, 0.9);
  chest.castShadow = true;
  root.add(chest);

  const yoke = ball(0.20, cloth);
  yoke.position.y = hipY + 0.60;
  yoke.scale.set(1.55, 0.52, 0.85);
  yoke.castShadow = true;
  root.add(yoke);

  // neck
  const neck = taper(0.052, 0.058, 0.09, SKIN);
  neck.position.y = hipY + 0.665;
  root.add(neck);

  // head
  const head = buildHead(opts.headScale || 1.0);
  head.group.position.y = hipY + 0.80;
  root.add(head.group);

  // arms: shoulder pivot, elbow pivot, hand
  const arms = [];
  [-1, 1].forEach(side => {
    const shoulder = new THREE.Group();
    shoulder.position.set(side * 0.20, hipY + 0.58, 0);
    root.add(shoulder);

    const deltoid = ball(0.075, cloth);
    shoulder.add(deltoid);

    const upper = taper(0.062, 0.05, 0.27, cloth);
    upper.position.y = -0.15;
    upper.castShadow = true;
    shoulder.add(upper);

    const elbow = new THREE.Group();
    elbow.position.y = -0.30;
    shoulder.add(elbow);

    const fore = taper(0.048, 0.038, 0.25, SKIN);
    fore.position.y = -0.13;
    fore.castShadow = true;
    elbow.add(fore);

    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.10, 0.045), SKIN);
    hand.position.y = -0.27;
    hand.castShadow = true;
    elbow.add(hand);

    arms.push({ shoulder, elbow, side });
  });

  const legs = [];
  if (opts.legs) {
    [-1, 1].forEach(side => {
      const hip = new THREE.Group();
      hip.position.set(side * 0.09, hipY, 0);
      root.add(hip);

      const thigh = taper(0.075, 0.06, 0.42, clothDark);
      thigh.position.y = -0.21;
      thigh.castShadow = true;
      hip.add(thigh);

      const knee = new THREE.Group();
      knee.position.y = -0.42;
      hip.add(knee);

      const shin = taper(0.055, 0.045, 0.40, clothDark);
      shin.position.y = -0.20;
      shin.castShadow = true;
      knee.add(shin);

      const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.06, 0.22), new THREE.MeshPhongMaterial({color:0x0b0d12}));
      shoe.position.set(0, -0.42, 0.05);
      shoe.castShadow = true;
      knee.add(shoe);

      legs.push({ hip, knee, side });
    });
  }

  return { root, head, arms, legs, hipY };
}

// ---------- the man on crutches ----------
const hero = buildHuman({ cloth:0x3d6f96, clothDark:0x20303f, hipY:1.02, headScale:1.0 });
hero.root.position.set(-1.55, 0, 0.1);
hero.root.rotation.y = 0.34;
scene.add(hero.root);

// hip band where the legs end
const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.15, 0.16, 20),
  new THREE.MeshPhongMaterial({color:0x2b3b4d, shininess:20}));
stump.position.set(0, 1.0, 0);
stump.castShadow = true;
hero.root.add(stump);

// two crutches, from the armpit down to the floor, angled out
const crutches = [];
[-1, 1].forEach(side => {
  const g = new THREE.Group();
  g.position.set(side * 0.20, 1.52, 0.02);
  g.rotation.z = -side * 0.16;
  g.rotation.x = -0.06;

  const shaft = taper(0.017, 0.017, 1.46, new THREE.MeshPhongMaterial({color:0xb9c2cf, shininess:150}));
  shaft.position.y = -0.73;
  shaft.castShadow = true;
  g.add(shaft);

  const pad = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.05, 0.16), new THREE.MeshPhongMaterial({color:0x232a35}));
  pad.position.y = -0.02;
  g.add(pad);

  const grip = taper(0.018, 0.018, 0.14, new THREE.MeshPhongMaterial({color:0x232a35}));
  grip.rotation.z = Math.PI / 2;
  grip.position.set(side * 0.02, -0.42, 0.03);
  g.add(grip);

  const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.012, 8, 18),
    new THREE.MeshPhongMaterial({color:0x232a35}));
  cuff.rotation.x = Math.PI / 2;
  cuff.position.set(side * 0.01, -0.24, 0.02);
  g.add(cuff);

  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.02, 12),
    new THREE.MeshPhongMaterial({color:0x11151d}));
  foot.position.y = -1.46;
  g.add(foot);

  hero.root.add(g);
  crutches.push(g);
});

// hands rest on the crutch grips
hero.arms[0].shoulder.rotation.z = 0.30;
hero.arms[0].shoulder.rotation.x = -0.55;
hero.arms[0].elbow.rotation.z = -0.55;
hero.arms[1].shoulder.rotation.z = -0.30;
hero.arms[1].shoulder.rotation.x = -0.55;
hero.arms[1].elbow.rotation.z = 0.55;

// ---------- the other party ----------
const other = buildHuman({ cloth:0x6d4a86, clothDark:0x241b2f, hipY:0.92, headScale:0.98, legs:true });
other.root.position.set(1.70, 0, 0.15);
other.root.rotation.y = -0.40;
scene.add(other.root);
other.legs.forEach(l => { l.hip.rotation.x = 0.0; });

// ---------- dialogue ----------
const LINES = [
  { t0: 0.6,  t1: 2.8,  who: 'A', text: "They said I would never stand." },
  { t0: 2.8,  t1: 4.7,  who: 'B', text: "And yet here you are." },
  { t0: 4.7,  t1: 6.6,  who: 'A', text: "On two sticks. Standing all the same." },
  { t0: 6.6,  t1: 8.3,  who: 'B', text: "You are angry." },
  { t0: 8.3,  t1: 9.8,  who: 'A', text: "No. I am awake." },
];
const dlgEl = document.getElementById('dialogue');
const whoEl = document.getElementById('who');
const lineEl = document.getElementById('line');

// ---------- shots ----------
const SHOTS = [
  { t0: 0.0,  t1: 2.8,  pos: [0.0, 1.95, 7.6],  look: [0.0, 1.35, 0.1] },
  { t0: 2.8,  t1: 5.4,  pos: [-1.35, 1.62, 2.30], look: [-1.55, 1.42, 0.1] },
  { t0: 5.4,  t1: 7.6,  pos: [1.55, 0.72, 2.15], look: [1.70, 1.55, 0.15] },
  { t0: 7.6,  t1: 10.0, pos: [0.25, 2.05, 6.6],  look: [0.0, 1.35, 0.1] },
];
function shotAt(tt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (tt >= SHOTS[i].t0 && tt < SHOTS[i].t1) return SHOTS[i];
  }
  return SHOTS[SHOTS.length - 1];
}

const STEP = 1/30;
const capText = document.getElementById('capText');
const titleEl = document.getElementById('title');

function caption(tt) {
  if (tt < 2.8) return "STAGING \u2014 weight on the crutches, the other man squared up to him";
  if (tt < 5.4) return "EXPRESSION \u2014 brows and mouth do the work, the hands stay locked on the grips";
  if (tt < 7.6) return "ANTICIPATION \u2014 the listener gathers himself before he answers";
  return "EXAGGERATION \u2014 the last line lands harder than the words that carry it";
}

function frame(tt) {
  const line = LINES.find(l => tt >= l.t0 && tt < l.t1);
  const speaking = line ? line.who : null;

  if (line) {
    dlgEl.style.opacity = 1;
    whoEl.textContent = line.who === 'A' ? 'ON CRUTCHES' : 'THE OTHER ONE';
    whoEl.style.color = line.who === 'A' ? '#7fd4ff' : '#c3b0ef';
    lineEl.textContent = line.text;
  } else {
    dlgEl.style.opacity = 0;
  }

  const talking = speaking === 'A';
  const talkingB = speaking === 'B';
  const beat = Math.abs(Math.sin(tt * 15));

  // mouths
  hero.head.mouth.scale.y = talking ? 0.25 + beat * 2.6 : 0.22;
  other.head.mouth.scale.y = talkingB ? 0.25 + Math.abs(Math.sin(tt * 14)) * 2.4 : 0.22;

  // brows: inner ends lift on emphasis
  hero.head.brows.forEach(b => {
    b.mesh.rotation.z = b.side * (talking ? 0.22 + Math.sin(tt * 2.4) * 0.06 : 0.10);
    b.mesh.position.y = 0.052 + (talking ? beat * 0.008 : 0);
  });
  other.head.brows.forEach(b => {
    b.mesh.rotation.z = b.side * (0.12 + Math.sin(tt * 1.5) * 0.03);
  });

  // head movement
  hero.head.group.rotation.y = Math.sin(tt * 0.9) * 0.14 - 0.06;
  hero.head.group.rotation.x = talking ? -0.05 + Math.sin(tt * 1.7) * 0.03 : 0.02;
  other.head.group.rotation.y = 0.22 + Math.sin(tt * 0.7) * 0.07;
  other.head.group.rotation.x = Math.sin(tt * 0.6) * 0.03;

  // the body rocks over the crutches when he pushes a point
  const push = talking ? Math.max(0, Math.sin(tt * 2.6)) ** 2 : 0;
  hero.root.position.x = -1.55 + push * 0.05;
  hero.root.rotation.z = -0.02 + Math.sin(tt * 2.0) * 0.012;
  hero.root.position.y = push * 0.015;

  // crutches take the weight: they flex a hair and slide forward with him
  crutches.forEach((c, i) => {
    const s = i === 0 ? -1 : 1;
    c.rotation.x = -0.06 + push * 0.05;
    c.rotation.z = -s * 0.16 - s * Math.sin(tt * 1.8) * 0.012;
  });

  // arms stay planted on the grips, elbows absorb the rock
  hero.arms.forEach(a => {
    a.shoulder.rotation.x = -0.55 - push * 0.08;
    a.elbow.rotation.z = (a.side === 1 ? 0.55 : -0.55) + push * 0.10;
  });

  // the other man: arms folded, then a shrug at the end
  const shrug = tt > 6.6 ? Math.min(1, (tt - 6.6) / 0.8) : 0;
  other.arms[0].shoulder.rotation.z = 0.15 + shrug * 0.55;
  other.arms[0].shoulder.rotation.x = 0.85 - shrug * 0.35;
  other.arms[0].elbow.rotation.z = -1.35 + shrug * 0.5;
  other.arms[1].shoulder.rotation.z = -0.15 - shrug * 0.55;
  other.arms[1].shoulder.rotation.x = 0.85 - shrug * 0.35;
  other.arms[1].elbow.rotation.z = 1.35 - shrug * 0.5;

  // weight shift onto one leg
  other.legs[0].hip.rotation.x = Math.sin(tt * 0.8) * 0.02;
  other.legs[1].hip.rotation.x = Math.sin(tt * 0.8) * 0.02;

  dust.rotation.y = tt * 0.015;

  // lights breathe, then tighten on the last line
  const endSnap = tt > 8.3 ? 1 + Math.min(1, (tt - 8.3) * 2.5) * 0.45 : 1;
  spotHero.intensity = 5.4 * endSnap;
  spotOther.intensity = 4.0 + Math.sin(tt * 1.6) * 0.22;
  rim.intensity = 0.75 + Math.sin(tt * 2.1) * 0.18;

  const s = shotAt(tt);
  camera.position.set(s.pos[0], s.pos[1], s.pos[2]);
  camera.lookAt(s.look[0], s.look[1], s.look[2]);

  capText.textContent = caption(tt);
  titleEl.style.opacity = tt < 0.7 ? 1 : 0;

  renderer.render(scene, camera);
}

if (location.hash === '#cap') {
  window.__step = (i) => { frame(i * STEP); };
  window.__step(1);
} else {
  let t = 0, last = performance.now(), acc = 0;
  const loop = (now) => {
    acc += (now - last) / 1000; last = now;
    if (acc > STEP) { t += STEP; acc = 0; }
    frame(t);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
window.__ready = true;
</script>
</body>
</html>
